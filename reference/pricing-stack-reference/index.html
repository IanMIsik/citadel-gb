  <script>
    function collapseToggle(buttonElement) {
      //this functions toggles the elements in the pricing stack tables
      let btnClickedCollapseState = '';
      let currentBtn = document.getElementById(buttonElement.id);
      let dataToggleTarget = currentBtn.getAttribute('data-class');
      let selectedItems = document.getElementsByClassName(dataToggleTarget);
      btnClickedCollapseState = buttonElement.className;

      let buttonClasses = buttonElement.className.split(' ');
      if (buttonClasses.length == 2) {
        //this is when a button has been clicked and the elements are collapsed
        for (let item of selectedItems) {
          let itemClass = item.getAttribute('class');
          let toggleClassAttribute = `${dataToggleTarget} collapse`;
          let toggleButtonClass = `btn btn-secondary collapsed`;
          item.setAttribute('class', toggleClassAttribute);
          currentBtn.setAttribute('class', toggleButtonClass);

          //helps to persist the state of the clicked buttons when new data comes in
          sessionStorage.setItem(
            dataToggleTarget,
            JSON.stringify({
              attributeClass: toggleClassAttribute,
              btnClass: toggleButtonClass
            })
          );
        }
      } else {
        for (let item of selectedItems) {
          //this is executed when the elements are uncollapsed
          let itemClass = item.getAttribute('class');
          let toggleClassAttribute = `${dataToggleTarget} collapse show`;
          let toggleButtonClass = `btn btn-secondary`;
          item.setAttribute('class', toggleClassAttribute);
          currentBtn.setAttribute('class', toggleButtonClass);
          //helps to persist the state of the clicked buttons when new data comes in
          sessionStorage.setItem(
            dataToggleTarget,
            JSON.stringify({
              attributeClass: toggleClassAttribute,
              btnClass: toggleButtonClass
            })
          );
        }
      }
    }
  </script>
