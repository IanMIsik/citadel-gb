<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in — Citadel</title>
  <link rel="stylesheet" href="/static/login.css?v=1" />
</head>
<body>
  <main class="login-card">
    <h1>Citadel</h1>
    <p class="login-sub">Sign in to continue</p>
    <form id="login-form" autocomplete="on" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/static/login.js?v=1"></script>
</body>
</html>
